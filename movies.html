<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phim lẻ | Rophim</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/components.css" />

    <script src="./js/components.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/filter.js"></script>
    <script src="./js/movies.js" defer></script>
    <script src="./js/main.js"></script>
  </head>

  <body>
    <div id="header-placeholder"></div>

    <main style="padding-top: 90px; max-width: 1692px; margin: 0 auto">
      <section class="mt-3 mb-4">
        <h2 class="section-title">
          <i class="fa-solid fa-film"></i>
          Phim lẻ
        </h2>

        <div id="movie-filter-bar"></div>

        <div class="movie-grid" id="movies-grid"></div>

        <div class="pagination">
          <button class="page-btn" id="firstPage" title="Về trang đầu">
            <i class="fa-solid fa-angles-left"></i>
          </button>

          <button class="page-btn" id="prevPage" title="Trang trước">
            <i class="fa-solid fa-angle-left"></i>
          </button>

          <span class="page-info">
            Trang <strong id="currentPage">1</strong> /
            <strong id="totalPage">1</strong>
          </span>

          <button class="page-btn" id="nextPage" title="Trang sau">
            <i class="fa-solid fa-angle-right"></i>
          </button>

          <button class="page-btn" id="lastPage" title="Về trang cuối">
            <i class="fa-solid fa-angles-right"></i>
          </button>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </body>
</html>
